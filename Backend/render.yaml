services:
  - type: web
    name: agninova
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TOMORROW_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
